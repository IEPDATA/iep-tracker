<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6f5f75">
  <title>Open IEP Tracker</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #3d3a45;
      background: #f8f5f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 440px);
      background: white;
      border: 1px solid #e8e0e6;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(70, 55, 75, .10);
      padding: 30px;
      text-align: center;
    }
    .mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: #eee6ef;
      color: #6f5f75;
      font-size: 28px;
      font-weight: 800;
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { line-height: 1.5; color: #77717d; }
    #open-tracker {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 15px 18px;
      border-radius: 12px;
      background: #6f5f75;
      color: white;
      font-size: 17px;
      font-weight: 750;
      text-decoration: none;
    }
    #open-tracker:active { transform: translateY(1px); }
    .small { margin: 18px 0 0; font-size: 13px; }
    .error {
      color: #9b4f5f;
      background: #fbecef;
      border-radius: 10px;
      padding: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">IEP</div>
    <h1>Opening the local tracker...</h1>
    <p id="status">Finding Megan's laptop on this Wi-Fi.</p>
    <a id="open-tracker" href="#">Open IEP Tracker</a>
    <p class="small">The laptop must be on and your phone must be on the same Wi-Fi.</p>
  </main>

  <script>
    const statusText = document.getElementById("status");
    const openButton = document.getElementById("open-tracker");

    function isSafeLocalTrackerUrl(value) {
      try {
        const parsed = new URL(value);
        const octets = parsed.hostname.split(".").map(Number);
        const privateAddress = octets.length === 4 && octets.every(Number.isInteger) && (
          octets[0] === 10 ||
          (octets[0] === 172 && octets[1] >= 16 && octets[1] <= 31) ||
          (octets[0] === 192 && octets[1] === 168)
        );
        return parsed.protocol === "http:" && parsed.port === "5000" && privateAddress;
      } catch {
        return false;
      }
    }

    async function readLatestAddress() {
      const apiUrl = "https://api.github.com/repos/iepdata/iep-tracker/contents/address.json?ref=main&t=" + Date.now();
      const response = await fetch(apiUrl, { cache: "no-store" });
      if (!response.ok) throw new Error("address unavailable");
      const file = await response.json();
      const text = new TextDecoder().decode(
        Uint8Array.from(atob(file.content.replace(/\s/g, "")), char => char.charCodeAt(0))
      );
      return JSON.parse(text);
    }

    async function start() {
      try {
        const address = await readLatestAddress();
        if (!isSafeLocalTrackerUrl(address.url)) throw new Error("unsafe address");

        openButton.href = address.url;
        openButton.style.display = "block";
        statusText.textContent = "Tracker found. If it does not open automatically, tap the button.";

        // Top-level navigation usually works on Android. The visible button remains
        // as a reliable fallback if a browser requires a user tap before going from
        // GitHub's HTTPS page to the laptop's local HTTP address.
        setTimeout(() => window.location.assign(address.url), 900);
      } catch {
        statusText.className = "error";
        statusText.textContent = "The tracker address is not available yet. Make sure Megan's laptop is on, then refresh this page.";
      }
    }

    start();
  </script>
</body>
</html>
